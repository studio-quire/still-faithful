// `-Plibrary.stages=registry,combinations`, `-Plibrary.keepGoing`, `-Plibrary.seed=N`, `-Plibrary.monkeyTicks=N`.
if (findProject(':library:harness-probe') != null) {
    def allLibrary = rootProject.subprojects.findAll { it.path.startsWith(':library:') && it.file('build.gradle').isFile() }
    allLibrary.each { evaluationDependsOn(it.path) }
    def libraryTestOnly = { it.file('gradle.properties').text.contains('library_test=true') }
    def named = providers.gradleProperty('library.mods').map { it.split(',') as List }.getOrElse(null)
    // A mod comes with what it depends on: the folder of a library mod is its id.
    def dependsOf = { p ->
        def json = p.file('src/main/resources/fabric.mod.json')
        json.isFile() ? (new groovy.json.JsonSlurper().parse(json).depends ?: [:]).keySet().collect { id -> allLibrary.find { it.name == id } }.findAll { it != null } : []
    }
    def withDepends = { Collection<Project> set ->
        def out = new LinkedHashSet<Project>()
        def todo = new ArrayList<Project>(set)
        while (!todo.isEmpty()) {
            def p = todo.remove(todo.size() - 1)
            if (out.add(p)) todo.addAll(dependsOf(p))
        }
        out as List
    }
    def subjects = named != null ? allLibrary.findAll { named.contains(it.name) } : allLibrary.findAll { !libraryTestOnly(it) }
    if (named != null && subjects.size() != named.size()) throw new GradleException("-Plibrary.mods: no such folder in library/: ${named - subjects*.name}")
    subjects = withDepends(subjects)
    def core = [project(':oldfaithful-settings').tasks.named('remapJar'), project(':oldfaithful-core').tasks.named('remapJar')]
    def serverBase = [project(':oldfaithful-hardening').tasks.named('remapJar'), project(':oldfaithful-saves').tasks.named('remapJar')]
    def harnessSettings = { task ->
        task.group = 'verification'
        task.dependsOn extractLwjgl3Natives
        task.gameJar = mc.clientJar
        task.intermediaryMappings = mc.intermediaryMappings
        task.loaderClasspath.from(configurations.loaderRuntime, bakedLwjgl.flatMap { it.output })
