// The release packs as they'll be published (docs/release.md): the start-up test on what's inside each pack's zip,
// unpacked as Prism would lay it out: its libraries on the classpath, its natives extracted, its mods (with the
// self-test mod beside them). `clientStartupTestPack` for Pure Faithful's, `clientStartupTestPackFixed` for Old
// Faithful's, `clientStartupTestPackStill` for Still Faithful's (its title line and settings button checked; its own
// changes are `clientStartupTestStill`'s). Prism itself and the instance files (components, icon, notes) aren't run here.
[[task: 'clientStartupTestPack', pack: 'releasePack', key: 'pure', oldFaithful: false, name: 'Pure Faithful'],
 [task: 'clientStartupTestPackFixed', pack: 'releasePackFixed', key: 'fixed', oldFaithful: true, name: 'Old Faithful'],
 [task: 'clientStartupTestPackStill', pack: 'releasePackStill', key: 'still', oldFaithful: true, name: 'Still Faithful',
  edition: 'Still Faithful:stillfaithful-polish']].each { p ->
    if (!rootProject.tasks.names.contains(p.pack)) return
    def packZip = rootProject.tasks.named(p.pack)
    def unpacked = tasks.register("${p.task}Unpack", Sync) {
        from { zipTree(packZip.get().archiveFile) }
        into layout.buildDirectory.dir("pack-test/${p.key}/instance")
    }
    def packNatives = tasks.register("${p.task}Natives", Sync) {
        dependsOn unpacked
        from { fileTree(unpacked.get().destinationDir) { include 'libraries/*natives*.jar' }.collect { zipTree(it) } }
        exclude 'META-INF/**'
        into layout.buildDirectory.dir("pack-test/${p.key}/natives")
    }
    def libraries = unpacked.map { fileTree(it.destinationDir) { include 'libraries/*.jar'; exclude 'libraries/*natives*.jar', 'libraries/intermediary-*.jar' } }
    tasks.register(p.task, oldfaithful.gradle.ClientStartupTask) {
        group = 'verification'
        description = "The start-up test on what's in the ${p.name} release pack."
        dependsOn packNatives
        gameJar = mc.clientJar
        intermediaryMappings = layout.file(unpacked.map { fileTree(it.destinationDir) { include 'libraries/intermediary-*.jar' }.singleFile })
        loaderClasspath.from(libraries)
        mods.from(unpacked.map { fileTree(it.destinationDir) { include '.minecraft/mods/*.jar' } }, tasks.named('remapJar'))
        natives = layout.buildDirectory.dir("pack-test/${p.key}/natives")
        soundsGameDir = rootProject.layout.projectDirectory.dir('local/cache/selftest-sounds')
        privateDesktop = rootProject.layout.projectDirectory.file('tools/private_desktop.py')
        runDir = rootProject.layout.projectDirectory.dir("local/run/client-startup-pack-${p.key}")
        oldFaithful = p.oldFaithful
        if (p.edition) extraJvmArgs = ["-Doldfaithful.selftest.edition=${p.edition}".toString()]
        if (gameJava.isPresent()) javaExecutable = gameJava
    }
}
