if (findProject(':library:tower-check') != null) {
    evaluationDependsOn(':library:tower-check')
    evaluationDependsOn(':library:buried-towers')
    // Pictures in a real tower, by coordinates: -PsceneViews, -PsceneSeed as sceneShotStill's, -PsceneBright=false for the tower's own light.
    // Each view is shot once it's built within 64 blocks of the camera (SceneShot's sceneSettle; -PsceneSettleRadius=N), 240
    // ticks at most; -PsceneSettle=false holds every view the whole 240, for more of the far land in views from outside.
    tasks.register('sceneShotTowers', oldfaithful.gradle.ClientStartupTask) {
        group = 'oldfaithful'
        description = 'Takes pictures of given places in a new world with Buried Towers, unseen.'
        dependsOn extractLwjgl3Natives
        gameJar = mc.clientJar
        intermediaryMappings = mc.intermediaryMappings
        loaderClasspath.from(configurations.loaderRuntime, bakedLwjgl.flatMap { it.output })
        mods.from(testedMods, project(':oldfaithful-display').tasks.named('remapJar'), speedMod, fixedMods, project(':oldfaithful-core').tasks.named('remapJar'), project(':library:buried-towers').tasks.named('remapJar'))
        natives = lwjgl3NativesDir
        soundsGameDir = rootProject.layout.projectDirectory.dir('local/cache/selftest-sounds')
        privateDesktop = rootProject.layout.projectDirectory.file('tools/private_desktop.py')
        // -PsceneRun=local/run/<folder> for a run folder of one's own, as the default is shared by every worktree.
        def runDirectory = rootProject.layout.projectDirectory.dir(providers.gradleProperty('sceneRun').getOrElse('local/run/scene-shot-towers'))
        runDir = runDirectory
        oldFaithful = findProject(':oldfaithful-options') != null
        windowRuns = false
        def views = providers.gradleProperty('sceneViews').getOrElse('')
        // -PspawnWatch="cx cz radius floorY floorH ticks;..." counts what a tower's floors spawn instead (SpawnWatch).
        def watch = providers.gradleProperty('spawnWatch').getOrElse('')
        // -PsceneTowers=complex makes the new world's towers complex, as Create World's page would; simple by default.
        configs = ['faithful-rules.properties': "rule.buried-towers.style=${providers.gradleProperty('sceneTowers').getOrElse('simple')}\n".toString()]
        def watchSeconds = watch.isEmpty() ? 0 : watch.split(';').collect { (it.trim().split(/\s+/)[5] as int).intdiv(20) + 20 }.sum()
        // -PcartRide="sx sy sz ex ey ez lx ly lz times;..." rides a tower's cart run instead (CartRide): the top station's brake, the bottom's, the lever.
        def ride = providers.gradleProperty('cartRide').getOrElse('')
        def rideSeconds = ride.isEmpty() ? 0 : ride.split(';').collect { def v = it.trim().split(/\s+/); 10 + 40 * (v.length > 9 ? v[9] as int : 1) }.sum()
        def seconds = 120 + 30 * Math.max(1, views.split(';').length) + watchSeconds + rideSeconds
        timeoutSeconds = seconds
        extraJvmArgs = ['-Dorg.prismlauncher.window.dimensions=1440x900', '-Doldfaithful.selftest.expectSize=1440x900',
                        "-Doldfaithful.selftest.stallMs=${(seconds - 30) * 1000}".toString(),
                        "-Doldfaithful.selftest.scene=${runDirectory.dir('shots').asFile.absolutePath}".toString(),
                        "-Doldfaithful.selftest.sceneViews=${views}".toString(), '-Doldfaithful.selftest.sceneViewTicks=240',
                        "-Doldfaithful.selftest.sceneSettle=${providers.gradleProperty('sceneSettle').getOrElse('true')}".toString(),
                        "-Doldfaithful.selftest.sceneSettleRadius=${providers.gradleProperty('sceneSettleRadius').getOrElse('64')}".toString(),
                        "-Doldfaithful.selftest.spawnWatch=${watch}".toString(),
                        "-Doldfaithful.selftest.cartRide=${ride}".toString(),
                        "-Doldfaithful.selftest.sceneBright=${providers.gradleProperty('sceneBright').getOrElse('true')}".toString(),
                        "-Doldfaithful.selftest.sceneSeed=${providers.gradleProperty('sceneSeed').getOrElse('31337')}".toString()]
        if (gameJava.isPresent()) javaExecutable = gameJava
    }
    tasks.register('buriedTowersTest', oldfaithful.gradle.BuriedTowersTestTask) {
        group = 'verification'
        description = "Buried Towers on really generated worlds, on the real server."
        dependsOn extractLwjgl3Natives, rootProject.tasks.named('serverPackage')
        gameJar = mc.clientJar
        intermediaryMappings = mc.intermediaryMappings
        loaderClasspath.from(configurations.loaderRuntime, bakedLwjgl.flatMap { it.output })
        mods.from(testedMods, project(':oldfaithful-display').tasks.named('remapJar'))
        serverMods.from(project(':oldfaithful-settings').tasks.named('remapJar'), project(':oldfaithful-core').tasks.named('remapJar'), project(':library:tower-check').tasks.named('remapJar'))
        towerMod.from(project(':library:buried-towers').tasks.named('remapJar'))
        editionMods.from(fixedMods, stillMods)
        serverPackage = rootProject.layout.projectDirectory.dir('local/server-package/OldFaithful-server')
        serverJar = mc.serverJar
        seeds = providers.gradleProperty('towers.seeds').map { it.split(',').collect { s -> s as long } }.orElse([1733L, 20261105L])
        size = providers.gradleProperty('towers.size').map { it as int }.orElse(48)
        mode = providers.gradleProperty('towers.mode').orElse('check')
        towers = providers.gradleProperty('towers.count').map { it as int }.orElse(6)
        at = providers.gradleProperty('towers.at')
        style = providers.gradleProperty('towers.style')
        natives = lwjgl3NativesDir
        soundsGameDir = rootProject.layout.projectDirectory.dir('local/cache/selftest-sounds')
        privateDesktop = rootProject.layout.projectDirectory.file('tools/private_desktop.py')
        windowRuns = false
        timeoutSeconds = 120
        runDir = rootProject.layout.projectDirectory.dir(providers.gradleProperty('towers.run').getOrElse('local/run/buried-towers-test'))
