// The speed benchmark (docs/speed.md): this writes local/bench/launch.json, the launch of each configuration as a
// player's launcher would do it (classpath, natives, mods), and tools/bench.py runs the game from it, unseen.
// `sdl` is our LWJGL component with the display mod; `lwjgl2` is vanilla's LWJGL 2 (our build of it), as the
// phase 2 instance runs it. Both carry the hardening mod and the self-test mod, which holds the benchmark.
tasks.register('benchSetup') {
    group = 'oldfaithful'
    description = 'Writes local/bench/launch.json for tools/bench.py: how to launch each benchmark configuration.'
    def display = project(':oldfaithful-display').tasks.named('remapJar')
    def lightingMod = findProject(':oldfaithful-lighting')?.tasks?.named('remapJar')
    def fixesMod = findProject(':oldfaithful-fixes')?.tasks?.named('remapJar')
    dependsOn extractLwjgl3Natives, extractNatives, bakedLwjgl, benchMods, display, speedMod
    if (lightingMod != null) dependsOn lightingMod
    if (fixesMod != null) dependsOn fixesMod
    inputs.file(mc.clientJar)
    inputs.file(mc.intermediaryMappings)
    def out = rootProject.file('local/bench/launch.json')
    outputs.upToDateWhen { false }
    doLast {
        def base = files(configurations.loaderRuntime).files*.absolutePath
        def game = [mc.intermediaryMappings.get().asFile.absolutePath, mc.clientJar.get().asFile.absolutePath]
        def jar = { t -> t.get().outputs.files.singleFile.absolutePath }
        def mods = benchMods.collect { jar(it) }
        def java = gameJava.isPresent() ? gameJava.get() : new File(System.getProperty('java.home'), 'bin/java').absolutePath
        def spec = [
            java: java,
            mainClass: 'net.fabricmc.loader.impl.launch.knot.KnotClient',
            configs: [
                sdl: [classpath: base + [bakedLwjgl.get().output.get().asFile.absolutePath] + game,
                      natives: lwjgl3NativesDir.get().asFile.absolutePath,
                      mods: mods + [jar(display)]],
                speed: [classpath: base + [bakedLwjgl.get().output.get().asFile.absolutePath] + game,
                        natives: lwjgl3NativesDir.get().asFile.absolutePath,
                        mods: mods + [jar(display), jar(speedMod)]],
                lwjgl2: [classpath: base + configurations.lwjglRuntime.files*.absolutePath + game,
                         natives: nativesDir.get().asFile.absolutePath,
                         mods: mods],
            ],
            sounds: rootProject.file('local/cache/selftest-sounds/resources').absolutePath,
        ]
        // Old Faithful's lighting (docs/lighting.md) on top of speed, where the mod is in the build.
        if (lightingMod != null) spec.configs.lighting = [classpath: spec.configs.speed.classpath, natives: spec.configs.speed.natives,
                                                          mods: spec.configs.speed.mods + [jar(lightingMod)]]
        // Old Faithful's fix mod on top of speed, with every fix (`fixes`) and with #70's chunk drawing off
        // (`fixesbeta`, beta's), to weigh that drawing's cost (docs/fixes.md > #70).
        if (fixesMod != null) {
            spec.configs.fixes = [classpath: spec.configs.speed.classpath, natives: spec.configs.speed.natives,
                                  mods: spec.configs.speed.mods + [jar(fixesMod)]]
            spec.configs.fixesbeta = spec.configs.fixes + [configFiles: ['oldfaithful-fixes.properties': 'render.seams=false\n']]
        }
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(spec))
        logger.lifecycle("Wrote ${out}")
    }
}
