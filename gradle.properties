# The CPU is shared with other sessions: keep Gradle small.
# The last option is the JVM's own default spelled out, and marks the daemons: a Gradle daemon serves any checkout
# that asks with the same JDK and the same options, and a checkout from before gw went by the JDK's real place (gw
# says why) starts its daemons on a path that goes when it does. Those lack this option, so no build from here
# lands in one.
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8 -XX:-HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.java.installations.auto-download=false
# Gradle keeps what it knows of files between builds and counts on being told of changes, and it isn't told of
# changes under a linked folder: a worktree, whose local/ is a link to the main checkout's, took a folder there that
# another checkout had since rewritten for its own, up to date (the server package, 2026-11-10). With this it looks
# again each build, which costs nothing that shows here (a build with nothing to do: 1.3 s either way).
org.gradle.vfs.watch=false

# Pure Faithful's version: its mods, the LWJGL component, its pack and server package carry it (docs/release.md).
oldfaithful_version=0.1.6
# What players see: the Pure edition's core (these mods, the LWJGL component, the pack, the server package) is named
# Pure Faithful publicly; Old Faithful will be Pure Faithful plus its fix mods. The file name
# prefix is also the name Prism gives an imported pack's instance.
release_name=Pure Faithful
release_file_name=PureFaithful
release_tagline=beta 1.7.3 as it was, safe and fast
# Where the release lives.
release_repo=studio-quire/pure-faithful
release_homepage=https://studioquire.org/pure-faithful/

# Old Faithful, the Fixed edition: Pure Faithful plus its own mods (those whose gradle.properties set
# oldfaithful_edition=fixed). It has its own version, carried by those mods and by its pack and server package; the
# Pure Faithful mods and component inside it keep oldfaithful_version above, and must be a released Pure Faithful's
# (docs/release.md > Versions).
fixed_edition_version=0.2.7
fixed_release_name=Old Faithful
fixed_release_file_name=OldFaithful
fixed_release_tagline=beta 1.7.3, fixed and fast
fixed_release_repo=studio-quire/old-faithful
fixed_release_homepage=https://studioquire.org/old-faithful/

